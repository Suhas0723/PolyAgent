[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyagent"
version = "1.0.0"
description = "Polymarket prediction market trading agent with a two-tier Claude analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
live = ["py-clob-client>=0.17.0"]

[project.scripts]
polyagent = "polyagent.cli:main"

[tool.setuptools.packages.find]
include = ["polyagent*"]
